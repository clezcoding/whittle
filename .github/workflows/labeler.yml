name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access: it only reads the config from the
      # base branch and never checks out or runs code from the pull request.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
