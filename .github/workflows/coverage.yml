name: Coverage

# Line coverage of the engine and the command line, with a floor. Not a required check (it needs
# a few minutes), but it runs on every change to the Rust code and fails below 80 % of lines, the
# bar the OpenSSF silver level asks for.
on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.lock", ".github/workflows/coverage.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.lock", ".github/workflows/coverage.yml"]
  schedule:
    - cron: "11 5 * * 4"

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  coverage:
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Measure
        run: |
          cargo llvm-cov -p whittle-core -p whittle-cli --locked \
            --fail-under-lines 80 --summary-only | tee coverage.txt
          {
            echo '### Line coverage'
            echo '```'
            tail -n 3 coverage.txt | cut -c1-200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
