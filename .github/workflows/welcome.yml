name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue in Whittle. A maintainer will take a look.
            If Whittle removed something by mistake, run `whittle history` and `whittle undo`: items stay in quarantine for 30 days by default.
          pr_message: |
            Thanks for your first pull request. CI will run in a moment; `make check` runs the same checks locally.
            Rules are the easiest contribution, see rules/README.md.
