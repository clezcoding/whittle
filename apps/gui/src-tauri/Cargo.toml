[package]
name = "whittle-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Whittle desktop app (Tauri). A thin shell around whittle-core."

[lib]
name = "whittle_app_lib"
path = "src/lib.rs"

[[bin]]
name = "whittle-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
whittle-core = { path = "../../../crates/whittle-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
