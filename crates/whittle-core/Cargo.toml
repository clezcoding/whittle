[package]
name = "whittle-core"
description = "Engine of Whittle: scan, plan, apply, undo. Safety first."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1.8.7"
dirs = "7.0.0"
glob = "0.3.4"
infer = "0.22.0"
plist = "1.10.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
