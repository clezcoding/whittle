[package]
name = "whittle-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
whittle-core = { path = "../crates/whittle-core" }
serde_json = "1"

# Own workspace: these targets need nightly and must not affect `cargo build` at the root.
[workspace]

[[bin]]
name = "safety_check"
path = "fuzz_targets/safety_check.rs"
test = false
doc = false

[[bin]]
name = "rules_yaml"
path = "fuzz_targets/rules_yaml.rs"
test = false
doc = false

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false
