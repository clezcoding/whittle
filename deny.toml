# cargo-deny: licences, advisories and sources for the Rust workspace.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Pulled in by the Tauri / GTK build toolchain (proc macros only, nothing runs it at runtime).
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro crate used at compile time by Tauri's dependencies" },
  # serde_yaml_ng -> unsafe-libyaml. Only reads the YAML rule files that ship with Whittle and the
  # user's own ~/.config/whittle/rules. Unmaintained, no known vulnerability. Revisit when a maintained
  # parser fits (tracked in docs/ROADMAP.md).
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no known vulnerability; parses only local rule files" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0",
  "BSL-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
